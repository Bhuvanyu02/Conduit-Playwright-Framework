<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CI pipeline</title>
  <desc>A trigger starts the app in Docker, tests run in two shards, reports are uploaded and published to GitHub Pages.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="240" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="20" y="85" width="130" height="70" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="85" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Trigger</text>
  <text x="85" y="135" text-anchor="middle" font-size="11" fill="#475569">PR · nightly · manual</text>

  <rect x="185" y="85" width="150" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="260" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Install and start app</text>
  <text x="260" y="135" text-anchor="middle" font-size="11" fill="#475569">Docker + wait-on</text>

  <rect x="380" y="45" width="130" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="445" y="76" text-anchor="middle" font-size="14" fill="#0f172a">Shard 1/2</text>
  <rect x="380" y="145" width="130" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="445" y="176" text-anchor="middle" font-size="14" fill="#0f172a">Shard 2/2</text>

  <rect x="555" y="85" width="140" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="625" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Upload reports</text>
  <text x="625" y="135" text-anchor="middle" font-size="11" fill="#475569">HTML + traces</text>

  <rect x="730" y="85" width="150" height="70" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="805" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Publish report</text>
  <text x="805" y="135" text-anchor="middle" font-size="11" fill="#475569">GitHub Pages</text>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M150 120 L185 120"/>
    <path d="M335 110 L380 75"/>
    <path d="M335 130 L380 165"/>
    <path d="M510 70 L555 108"/>
    <path d="M510 170 L555 132"/>
    <path d="M695 120 L730 120"/>
  </g>
</svg>
