<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Framework architecture</title>
  <desc>Tests use custom fixtures, which use an API client and page objects to reach the backend and frontend running in Docker.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Tests group -->
  <rect x="20" y="40" width="180" height="380" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="110" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Tests</text>
  <rect x="40" y="80" width="140" height="56" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="110" y="113" text-anchor="middle" font-size="14" fill="#0f172a">API tests</text>
  <rect x="40" y="160" width="140" height="56" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="110" y="193" text-anchor="middle" font-size="14" fill="#0f172a">UI tests</text>
  <rect x="40" y="240" width="140" height="56" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="110" y="273" text-anchor="middle" font-size="14" fill="#0f172a">Hybrid tests</text>
  <rect x="40" y="320" width="140" height="56" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="110" y="344" text-anchor="middle" font-size="14" fill="#0f172a">Quality tests</text>
  <text x="110" y="362" text-anchor="middle" font-size="12" fill="#475569">a11y · visual</text>

  <!-- Zod schemas -->
  <rect x="250" y="50" width="170" height="50" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="335" y="80" text-anchor="middle" font-size="14" fill="#0f172a">Zod schemas</text>

  <!-- Fixtures -->
  <rect x="250" y="130" width="170" height="180" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="335" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Custom fixtures</text>
  <text x="335" y="227" text-anchor="middle" font-size="12" fill="#475569">users · articles</text>
  <text x="335" y="245" text-anchor="middle" font-size="12" fill="#475569">auth state · cleanup</text>

  <!-- Data factories -->
  <rect x="250" y="340" width="170" height="50" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="335" y="370" text-anchor="middle" font-size="14" fill="#0f172a">Data factories (Faker)</text>

  <!-- API client and page objects -->
  <rect x="480" y="90" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="555" y="116" text-anchor="middle" font-size="14" fill="#0f172a">API client</text>
  <text x="555" y="134" text-anchor="middle" font-size="12" fill="#475569">ConduitApi</text>
  <rect x="480" y="290" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="555" y="326" text-anchor="middle" font-size="14" fill="#0f172a">Page objects</text>

  <!-- App under test group -->
  <rect x="690" y="40" width="190" height="380" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="785" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">App under test (Docker)</text>
  <rect x="710" y="90" width="150" height="60" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="785" y="126" text-anchor="middle" font-size="14" fill="#0f172a">Backend API</text>
  <rect x="710" y="290" width="150" height="60" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="785" y="326" text-anchor="middle" font-size="14" fill="#0f172a">Frontend</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M180 108 L250 160"/>
    <path d="M180 188 L250 200"/>
    <path d="M180 268 L250 250"/>
    <path d="M180 348 L250 290"/>
    <path d="M250 75 L182 95"/>
    <path d="M420 175 L480 125"/>
    <path d="M420 265 L480 315"/>
    <path d="M335 310 L335 340"/>
    <path d="M630 120 L710 120"/>
    <path d="M630 320 L710 320"/>
    <path d="M785 290 L785 150"/>
  </g>
</svg>
