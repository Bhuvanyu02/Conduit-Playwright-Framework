name: tests
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      UI_URL: http://localhost:4100
      API_URL: http://localhost:8080/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start app under test
        run: |
          git clone https://github.com/drakulavich/spring-boot-realworld-example-app.git ../backend
          git -C ../backend checkout 82da7047001e7f39f4c9c28d4933bcc783f60b76
          git clone https://github.com/drakulavich/react-redux-realworld-example-app.git ../frontend
          git -C ../frontend checkout ee72eba4056392c95a27bc48d385d3f54ba38a18
          docker compose up -d --build
          npx wait-on http-get://localhost:8080/tags http-get://localhost:4100 --timeout 300000

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}

      - name: App logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14