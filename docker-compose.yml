# App under test: RealWorld backend (Spring Boot) + frontend (React/Redux).
# Neither upstream repo ships a Dockerfile, so they are defined inline here and
# built from local clones. Clone locations default to ../backend and ../frontend:
#
#   git clone https://github.com/drakulavich/spring-boot-realworld-example-app.git ../backend
#   git clone https://github.com/drakulavich/react-redux-realworld-example-app.git ../frontend
#   docker compose up -d --build
#
# Override with BACKEND_DIR / FRONTEND_DIR if your clones live elsewhere.

services:
  backend:
    build:
      context: ${BACKEND_DIR:-../backend}
      dockerfile_inline: |
        FROM eclipse-temurin:11-jdk AS build
        WORKDIR /app
        COPY . .
        RUN ./gradlew bootJar -x test --no-daemon

        FROM eclipse-temurin:11-jre
        WORKDIR /app
        COPY --from=build /app/build/libs/*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
    ports:
      - "8080:8080"
    environment:
      # SQLite allows only one writer. With the default multi-connection pool,
      # parallel test workers get SQLITE_BUSY (HTTP 500). One connection
      # serialises writes; busy_timeout + WAL let readers and writers wait.
      SPRING_DATASOURCE_URL: jdbc:sqlite:dev.db?busy_timeout=10000&journal_mode=WAL
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "1"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: ${FRONTEND_DIR:-../frontend}
      args:
        # The browser on the host calls the API, so this must be a host URL.
        API_ROOT: http://localhost:8080
      dockerfile_inline: |
        # react-scripts 1.x does not run on modern Node
        FROM node:14-alpine
        WORKDIR /app
        COPY package.json ./
        RUN npm install --no-audit --no-fund
        COPY . .
        ARG API_ROOT
        # Upstream hard-codes a public demo API; point it at the local backend.
        RUN sed -i "s#^const API_ROOT = .*#const API_ROOT = '$${API_ROOT}';#" src/agent.js \
         && grep -q "$${API_ROOT}" src/agent.js
        EXPOSE 4100
        CMD ["npm", "start"]
    ports:
      - "4100:4100"
    stdin_open: true
    depends_on:
      - backend
    restart: unless-stopped
